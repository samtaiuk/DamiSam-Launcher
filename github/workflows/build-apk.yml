
name: Build DamiSam Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find uploaded project ZIP
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No project ZIP found in repository root."
            exit 1
          fi
          if [ "${#archives[@]}" -gt 1 ]; then
            echo "More than one ZIP found. Keep only the DamiSam project ZIP."
            exit 1
          fi
          echo "zip=${archives[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/damisam-extracted"
          unzip -q "${{ steps.archive.outputs.zip }}" -d "$RUNNER_TEMP/damisam-extracted"
          PROJECT_DIR="$(find "$RUNNER_TEMP/damisam-extracted" -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Invalid Android project ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DamiSam-Launcher-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
